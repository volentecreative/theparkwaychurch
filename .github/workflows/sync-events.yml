name: Sync calendar events

# Copies upcoming events from the church's public CCB calendar (iCal) into the Webflow
# "Events" collection. See scripts/sync-events.js and the README.
on:
  schedule:
    - cron: '17 * * * *' # hourly; GitHub only runs schedules on the default branch
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would change without writing to Webflow
        type: boolean
        default: false

concurrency:
  group: sync-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The feed keeps its HTML (no strip_html) so links in descriptions reach the Body field.
      - run: node scripts/sync-events.js
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          WEBFLOW_COLLECTION_ID: ${{ vars.WEBFLOW_COLLECTION_ID || '6b005da0bd484318dd94b6dd' }}
          EVENTS_ICAL_URL: ${{ vars.EVENTS_ICAL_URL || 'https://theparkwaychurch.ccbchurch.com/w_calendar_sub.ics' }}
          # The weekly gatherings are already in the homepage schedule; keep them out of the cards.
          EVENTS_SKIP: ${{ vars.EVENTS_SKIP || '^(Worship Service|Evening Prayer Service|Youth|Theological Equipping Class)' }}
          EVENTS_HOME: ${{ vars.EVENTS_HOME }}
          EVENTS_DAYS_AHEAD: ${{ vars.EVENTS_DAYS_AHEAD }}
          EVENTS_TIMEZONE: ${{ vars.EVENTS_TIMEZONE }}
          # Demo mode for styling the cards: 1 (= 6 events) or a number. Remove the variable before launch.
          EVENTS_DEMO: ${{ vars.EVENTS_DEMO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
